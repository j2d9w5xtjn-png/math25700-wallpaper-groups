<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallpaper Groups in Escher's Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: one-screen lecture demo in the style of the honeycomb page and the Escher page. The tilings and their symmetries are on the left, the tiling in the middle, and the readout (the group, the move, where the tracing is, and the sources) on the right. */
:root {
  --bg: #EFEEEC;
  --surface: #FAFAF9;
  --stage: #FCFBFA;
  --stage-glow: #FFFFFF;
  --ink: #1C1919;
  --muted: #615B5A;
  --rule: #D3CFCC;
  --accent: #800000;
  --accent-text: #800000;
  --accent-ink: #FFFFFF;
  --accent-soft: #F4E7E5;
  --trace: #8A0000;
  --c0: #1F5FA8; --c1: #C25E00; --c2: #2B7A4B; --c3: #A8326E;
  --mirror: #5B2E91; --glide: #1E7A50; --lat: #1C1919;
  --font-math: "STIX Two Text", "STIX Two Math", "Times New Roman", Times, serif;
  --font-ui: "Source Sans 3", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131111; --surface: #1D1A19; --stage: #191615; --stage-glow: #221E1D;
    --ink: #ECE8E5; --muted: #A59E9A; --rule: #37302E;
    --accent: #8E1B1B; --accent-text: #E39A9A; --accent-ink: #FFFFFF; --accent-soft: #3A1E1E;
    --trace: #FF5A4E;
    --c0: #6FA8E8; --c1: #F0A04B; --c2: #5CC594; --c3: #E57BB0;
    --mirror: #C3A0F0; --glide: #6FD6A2; --lat: #ECE8E5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131111; --surface: #1D1A19; --stage: #191615; --stage-glow: #221E1D;
  --ink: #ECE8E5; --muted: #A59E9A; --rule: #37302E;
  --accent: #8E1B1B; --accent-text: #E39A9A; --accent-ink: #FFFFFF; --accent-soft: #3A1E1E;
  --trace: #FF5A4E;
  --c0: #6FA8E8; --c1: #F0A04B; --c2: #5CC594; --c3: #E57BB0;
  --mirror: #C3A0F0; --glide: #6FD6A2; --lat: #ECE8E5;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.4; }
i, .math { font-family: var(--font-math); }
sub, sup { font-size: 0.72em; line-height: 0; }
a { color: var(--accent-text); }

.app { height: 100%; max-width: 1680px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 8px; display: flex; flex-direction: column; gap: 10px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; }
.title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; min-width: 0; }
h1 { margin: 0; font-family: var(--font-math); font-weight: 600; font-size: clamp(1.45rem, 2.2vw, 2rem); line-height: 1.1; color: var(--accent-text); text-wrap: balance; }
.subtitle { margin: 0; font-family: var(--font-math); font-style: italic; font-size: 1.05rem; color: var(--muted); }
.top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* Buttons */
.btn, .seg button, .tog {
  display: inline-flex; align-items: center; gap: 0.45em; padding: 0.5em 0.75em;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink);
  font: 600 0.92rem/1 var(--font-ui); cursor: pointer; white-space: nowrap;
}
.btn:hover, .seg button:hover, .tog:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; border-color: var(--rule); }
.btn:focus-visible, .seg button:focus-visible, .tog:focus-visible, .rot:focus-visible, .dw:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent-text); outline-offset: 2px;
}
.btn.primary, .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); position: relative; }
.seg.small button { padding: 0.42em 0.6em; font-size: 0.85rem; }
.tog { padding: 0.38em 0.6em; font-weight: 600; font-size: 0.85rem; color: var(--muted); }
.tog::before { content: ""; width: 0.8em; height: 0.8em; border: 1.5px solid currentColor; border-radius: 3px; }
.tog[aria-pressed="true"] { color: var(--ink); }
.tog[aria-pressed="true"]::before { background: var(--accent-text); border-color: var(--accent-text); box-shadow: inset 0 0 0 2px var(--surface); }
kbd { padding: 0.1em 0.36em; border: 1px solid currentColor; border-radius: 4px; font: 600 0.7rem/1.2 var(--font-ui); opacity: 0.6; }

/* Three columns */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(280px, 340px); gap: 16px; }
.catalog, .readout { min-height: 0; overflow-y: auto; min-width: 0; }

/* Stage */
.stage { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.shows { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bar-label { font: 600 0.72rem var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.viewport { position: relative; flex: 1; min-height: 280px; border: 1px solid var(--rule); border-radius: 12px; background: radial-gradient(circle at 50% 45%, var(--stage-glow), var(--stage) 70%); overflow: hidden; }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.viewport canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 8px; margin: 0; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--stage) 80%, transparent); font-size: 0.8rem; color: var(--muted); pointer-events: none; transition: opacity 400ms ease; }
.hint.gone { opacity: 0; }
.credit { position: absolute; right: 10px; top: 8px; margin: 0; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--stage) 85%, transparent); font-size: 0.74rem; color: var(--muted); pointer-events: none; }
.playbar { flex-wrap: nowrap; }
.playbar input[type="range"] { flex: 1; min-width: 60px; accent-color: var(--accent-text); }
.live { min-width: 8.4em; font-family: var(--font-math); font-size: 1.02rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
#btn-play { min-width: 7.6em; justify-content: space-between; }

/* Catalog */
.catalog { display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
.eyebrow { margin: 0; font: 600 0.75rem var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.drawings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.dw { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0.28em 0.1em 0.22em; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface); color: var(--ink); cursor: pointer; min-width: 0; }
.dw:hover { border-color: var(--muted); }
.dw .g { font: 600 0.95rem/1.1 var(--font-math); font-style: italic; }
.dw .n { font: 600 0.6rem/1.1 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dw[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dw[aria-current="true"] .n { color: var(--accent-ink); opacity: 0.85; }
.dfam { margin: 0; font-size: 0.74rem; color: var(--muted); }
.block { display: flex; flex-direction: column; gap: 5px; padding-top: 7px; border-top: 1px solid var(--rule); }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.block-head h3 { margin: 0; font: 600 1.08rem var(--font-math); }
.block-head .count { font: 600 0.8rem var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.grp { display: flex; flex-direction: column; gap: 2px; }
.grp-label { margin: 0; font-size: 0.82rem; font-weight: 600; color: var(--ink); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 4px; }
.rot {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35em; min-width: 0; padding: 0.27em 0.3em;
  border: 1px solid var(--rule); border-radius: 7px; background: var(--surface); color: var(--ink);
  font: 400 0.95rem/1.1 var(--font-math); white-space: nowrap; text-align: center; cursor: pointer;
  transition: background-color 160ms, color 160ms, box-shadow 160ms;
}
.rot:hover { border-color: var(--muted); }
.rot.is-move { box-shadow: inset 0 0 0 2px var(--accent-text); border-color: var(--accent-text); }
.rot.ghost { background: transparent; border-style: dashed; color: var(--muted); }
.rot.ghost.is-move { color: var(--ink); }
.rot .sym { flex: none; width: 0.85em; height: 0.85em; }
.rot .cperm { flex: none; width: 0.42em; height: 0.42em; border-radius: 50%; background: var(--muted); opacity: 0.8; }
.sum { margin: 0; padding-top: 6px; border-top: 1px solid var(--rule); font-size: 0.85rem; color: var(--muted); }
.sum i, .sum .math { color: var(--ink); }

/* Readout */
.readout { display: flex; flex-direction: column; gap: 10px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
.mv-name { margin: 0; font: 600 1.14rem/1.25 var(--font-math); text-wrap: balance; }
.mv-class { margin: 0; font-size: 0.86rem; color: var(--muted); }
.mv-class i { color: var(--ink); }
.dr-title { margin: 0; font: 600 1.08rem/1.2 var(--font-math); }
.dr-meta { margin: 0; font: 400 0.82rem var(--font-ui); color: var(--muted); white-space: nowrap; }
.gname { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0; }
.gname .big { font: 600 1.6rem/1 var(--font-math); font-style: italic; color: var(--accent-text); }
#dr-detail { font-size: 0.84rem; line-height: 1.35; }
.gname .orb { font-size: 0.84rem; color: var(--muted); }
.facts { margin: 0; display: grid; border-top: 1px solid var(--rule); }
.fact { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-block: 0.3em; border-bottom: 1px solid var(--rule); }
.fact dt { font-size: 0.84rem; color: var(--muted); white-space: nowrap; }
.fact dd { margin: 0; font-family: var(--font-math); font-size: 1.02rem; text-align: right; word-spacing: 0.05em; min-width: 0; overflow-wrap: anywhere; }
.pill { margin: 0; align-self: flex-start; padding: 0.28em 0.75em; border-radius: 999px; font: 600 0.86rem var(--font-ui); background: var(--accent); color: var(--accent-ink); }
.pill.rev { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.pill.transit { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--rule); }
.pill.not { background: transparent; color: var(--ink); border: 1px dashed var(--muted); }
.detail { margin: 0; display: flex; flex-direction: column; gap: 3px; font-size: 0.9rem; color: var(--muted); }
.detail p { margin: 0; }
.detail .math, .detail i { color: var(--ink); }
.swatch { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; border: 1px solid var(--muted); vertical-align: -0.08em; }
.colors { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-family: var(--font-math); color: var(--ink); }
.btnrow { display: flex; gap: 8px; padding-top: 2px; }
.stalable { transition: opacity 200ms; }
.stale { opacity: 0.35; }
.key { margin: 0; font-size: 0.82rem; line-height: 1.45; color: var(--muted); }
.key i { color: var(--ink); }
.key svg { width: 0.9em; height: 0.9em; vertical-align: -0.1em; }
details.card summary { cursor: pointer; font: 600 0.75rem var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.src { margin: 0; font-size: 0.82rem; line-height: 1.45; color: var(--muted); }
.src p { margin: 0 0 0.45em; }
.src cite { font-style: italic; color: var(--ink); }

/* Footer */
.keys { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 0.8rem; color: var(--muted); }
.keys kbd { opacity: 0.85; }

@media (min-width: 1181px) and (max-height: 760px) {
  .app { padding-block: 8px 6px; gap: 8px; }
  .catalog { gap: 5px; }
  .block { gap: 3px; padding-top: 5px; }
  .grp { gap: 1px; }
  .chips { row-gap: 2px; }
  .rot { padding-block: 0.16em; }
  .readout { gap: 8px; }
  .card { gap: 4px; padding: 9px 12px; }
  .fact { padding-block: 0.2em; }
  .detail { gap: 2px; }
}
@media (min-width: 1181px) and (max-height: 680px) { .keys { display: none; } }
@media (max-width: 1180px) {
  html, body { height: auto; }
  .app { height: auto; }
  .layout { grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); }
  .viewport { flex: none; height: min(72vh, 640px); }
  .catalog { grid-column: 1 / -1; order: 3; overflow: visible; }
  .readout { overflow: visible; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .viewport { height: auto; aspect-ratio: 1; max-height: 78vh; }
  .playbar { flex-wrap: wrap; }
  .playbar input[type="range"] { flex-basis: 100%; order: 3; }
  .live { min-width: max-content; flex: 1; }
  .keys { display: none; }
  .btn kbd, .seg kbd { display: none; }
  .drawings { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); }
}
@media (max-width: 480px) {
  .app { padding-inline: 10px; }
  .top-actions { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .hint, .rot, .stalable { transition: none; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="title">
      <h1 id="h1">Wallpaper groups in Escher’s style</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-prev" type="button" title="Previous drawing (←)">← Prev</button>
      <button class="btn" id="btn-next" type="button" title="Next drawing (→)">Next →</button>
      <button class="btn" id="btn-tour" type="button" aria-pressed="false"><span id="tour-label">Play all</span> <kbd>A</kbd></button>
      <button class="btn" id="btn-full" type="button">Full screen <kbd>F</kbd></button>
    </div>
  </header>

  <main class="layout">
    <nav class="catalog" id="catalog" aria-label="Drawings and symmetries">
      <p class="eyebrow">Tilings, by wallpaper group</p>
      <div class="drawings" id="drawings" role="group" aria-label="Drawings"></div>
      <p class="dfam" id="dfam"></p>
      <div id="moves"></div>
      <p class="sum" id="sum"></p>
      <p class="key" id="key"></p>
    </nav>

    <section class="stage" aria-label="The drawing">
      <div class="bar">
        <div class="shows" role="group" aria-label="Show">
          <span class="bar-label">Show</span>
          <button class="tog" type="button" id="show-lattice" data-show="lattice" aria-pressed="true" title="The lattice of translations and one cell spanned by a₁ and a₂ (L)">Lattice</button>
          <button class="tog" type="button" id="show-centers" data-show="centers" aria-pressed="true" title="Centers of rotation: the shape gives the order (lens 2, triangle 3, square 4, hexagon 6) and the color the class (C)">Centers</button>
          <button class="tog" type="button" id="show-mirrors" data-show="mirrors" aria-pressed="true" title="Mirror lines (M)">Mirrors</button>
          <button class="tog" type="button" id="show-glides" data-show="glides" aria-pressed="false" title="Axes of glide reflections that are not mirror lines (G)">Glides</button>
        </div>
        <div class="seg small" role="group" aria-label="Tracing">
          <button type="button" data-trace="cutout" aria-pressed="true" title="The symmetry moves a colored cut-out of the tiling over a faded copy (T)">Cut-out</button>
          <button type="button" data-trace="outline" aria-pressed="false" title="The symmetry moves a tracing of all the outlines (T)">Outline</button>
          <button type="button" data-trace="off" aria-pressed="false" title="Hide the tracing: only its flag moves (T)">Off</button>
        </div>
        <div class="seg small" role="group" aria-label="Speed">
          <button type="button" data-speed="slow" aria-pressed="false">Slow</button>
          <button type="button" data-speed="normal" aria-pressed="true">Normal</button>
          <button type="button" data-speed="fast" aria-pressed="false">Fast</button>
        </div>
      </div>
      <div class="viewport" id="viewport">
        <canvas id="cv" role="img" aria-label="A tiling of the plane, with a tracing of it that the symmetries move. Drag to move the view."></canvas>
        <p class="hint" id="hint">Drag to move the view, scroll to zoom. Double-click to reset it.</p>
        <p class="credit" id="credit"></p>
      </div>
      <div class="bar playbar">
        <button class="btn primary" id="btn-play" type="button"><span id="play-label">Play</span> <kbd>Space</kbd></button>
        <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="How far this move has gone">
        <output class="live" id="mv-live" for="scrub"></output>
        <button class="btn" id="btn-undo" type="button">Undo <kbd>Z</kbd></button>
        <button class="btn" id="btn-reset" type="button">Reset <kbd>R</kbd></button>
        <div class="seg small" role="group" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
          <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
        </div>
      </div>
    </section>

    <aside class="readout" aria-label="Readout">
      <section class="card" id="dr-card">
        <h2 class="dr-title"><span id="dr-title"></span><span class="dr-meta" id="dr-meta"></span></h2>
        <p class="gname"><span class="big" id="dr-group"></span><span class="orb" id="dr-orb"></span></p>
        <dl class="facts">
          <div class="fact"><dt>Lattice, point group</dt><dd id="dr-lat"></dd></div>
          <div class="fact" id="dr-cg-row"><dt>Keeping the colors</dt><dd id="dr-cg"></dd></div>
        </dl>
        <div class="detail" id="dr-detail"></div>
      </section>
      <section class="card" aria-live="polite">
        <p class="eyebrow" id="mv-eyebrow">This move</p>
        <h2 class="mv-name" id="mv-name"></h2>
        <p class="mv-class" id="mv-class"></p>
        <dl class="facts" id="mv-facts">
          <div class="fact"><dt>Map</dt><dd id="mv-formula"></dd></div>
          <div class="fact"><dt id="mv-fixlabel">Fixes</dt><dd id="mv-fix"></dd></div>
          <div class="fact" id="mv-colors-row"><dt>Colors</dt><dd id="mv-colors"></dd></div>
        </dl>
      </section>
      <section class="card">
        <p class="eyebrow" id="pos-eyebrow">Where the tracing is now</p>
        <p class="pill" id="pos-pill"></p>
        <div class="stalable" id="pos-body">
          <dl class="facts">
            <div class="fact"><dt><i>g</i>(<i>x</i>, <i>y</i>)</dt><dd id="pos-formula"></dd></div>
            <div class="fact" id="pos-colors-row"><dt>Colors</dt><dd id="pos-colors"></dd></div>
          </dl>
        </div>
      </section>
      <details class="card" id="sources">
        <summary>Sources and credits</summary>
        <div class="src" id="src"></div>
      </details>
    </aside>
  </main>

  <footer class="keys" id="keys"></footer>
</div>

<script>
(() => {
  "use strict";
// ---------- wallpaper groups: exact data and geometry (no DOM) ----------
// Inlined into the page by build.sh and loaded by tests/core_test.js under Node.
//
// An element of a plane group is stored in fractional coordinates with respect to the lattice basis a1, a2 and the
// origin of the drawing: g = {m: [a, b, c, d], t: [t1, t2]} sends (x, y) to (a x + b y + t1, c x + d y + t2).
// The general positions below are those of the International Tables for Crystallography, Vol. A (the standard
// settings), so the origin is the usual one: a center of highest order where there is one.
const WP = (() => {
  "use strict";
  const H = 0.5;
  const I = [1, 0, 0, 1], N = [-1, 0, 0, -1];
  const MX = [-1, 0, 0, 1], MY = [1, 0, 0, -1];                 // (−x, y), (x, −y)
  const R4 = [0, -1, 1, 0], R4i = [0, 1, -1, 0];                // (−y, x), (y, −x)
  const D1 = [0, 1, 1, 0], D2 = [0, -1, -1, 0];                 // (y, x), (−y, −x)
  const R3 = [0, -1, 1, -1], R3i = [-1, 1, -1, 0];              // (−y, x − y), (−x + y, −x)

    $("src").innerHTML = sourcesHtml(d);
  }
  function keyHtml() {
    const T = THEME || theme();
    const parts = [];
    const ords = [...new Set(D.cls.centers.map((c) => c.n))];
    if (ords.length) parts.push(`Centers of order ${ords.join(", ")}: ${D.cls.centers.map((c) => `${symSvg(c.n, T.cls[c.ci % 4])}&nbsp;${c.letter}`).join(" ")}.`);
    if (D.cls.mirrors.length) parts.push(`${lineSvg(T.mirror)} mirror lines.`);
    if (D.cls.glides.length) parts.push(`${lineSvg(T.glide, true)} glide axes (show them with <i>Glides</i>).`);
    parts.push(`Colors: ${D.colors.palette.map((c, i) => `<span class="swatch" style="background:${c}" title="${esc(D.colors.names[i])}"></span>`).join(" ")} (one for each element of the point group).`);
    parts.push(`Coordinates (<i>x</i>, <i>y</i>) are with respect to <i>a</i>₁ and <i>a</i>₂, from the origin at the corner of the shaded cell.`);
    return parts.join(" ");
  }
  function sourcesHtml(d) {
    const s = [];
    s.push(`<p><b>Based on M. C. Escher’s work.</b> ${SOURCES.based}</p>`);
    s.push(`<p><b>These tilings.</b> ${SOURCES.method}</p>`);
    s.push(`<p><b>Escher.</b> ${SOURCES.escher}</p>`);
    s.push(`<p><b>Further reading.</b> ${SOURCES.reading}</p>`);
    return s.join("");
  }
  function renderAll() {
    if (!D) return;
    renderMove();
    renderPos();
    renderControls();
  }

  let hintGone = false;
  function hideHint() { if (!hintGone) { hintGone = true; $("hint").classList.add("gone"); } }
  function toggleFull() {
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      const req = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if (req && req.catch) req.catch(() => {});
    } catch (err) { /* full screen unavailable */ }
  }

  function wire() {
    $("drawings").addEventListener("click", (e) => { const b = e.target.closest(".dw"); if (b) select(+b.dataset.d); });
    $("moves").addEventListener("click", (e) => { const b = e.target.closest(".rot"); if (b) request(D.EL[+b.dataset.i]); });
    $("btn-prev").addEventListener("click", () => select(di - 1));
    $("btn-next").addEventListener("click", () => select(di + 1));
    $("btn-tour").addEventListener("click", tour);
    $("btn-full").addEventListener("click", toggleFull);
    $("btn-play").addEventListener("click", playPause);
    $("btn-undo").addEventListener("click", undo);
    $("btn-reset").addEventListener("click", reset);
    $("zoom-in").addEventListener("click", () => zoomBy(1.25));
    $("zoom-out").addEventListener("click", () => zoomBy(1 / 1.25));
    document.querySelectorAll("[data-show]").forEach((b) => b.addEventListener("click", () => { show[b.dataset.show] = !show[b.dataset.show]; store.set("wpt.show", JSON.stringify(show)); renderControls(); kick(); }));
    document.querySelectorAll("[data-trace]").forEach((b) => b.addEventListener("click", () => { trace = b.dataset.trace; store.set("wpt.trace2", trace); renderControls(); kick(); }));
    document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => { speed = b.dataset.speed; store.set("wpt.speed", speed); renderControls(); }));
    const sc = $("scrub");
    sc.addEventListener("input", () => {
      if (!cur) return;
      stopTour();
      cur.playing = false;
      cur.t = +sc.value / 1000;
      renderAll(); kick();
    });
    let drag = null;
    cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; cv.setPointerCapture(e.pointerId); cv.classList.add("dragging"); });
    cv.addEventListener("pointermove", (e) => {
      if (!drag) return;
      view.x = drag.vx - (e.clientX - drag.x) / scale; view.y = drag.vy + (e.clientY - drag.y) / scale;
      hideHint(); kick();
    });
    const endDrag = () => { drag = null; cv.classList.remove("dragging"); };
    cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
    cv.addEventListener("wheel", (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomBy(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    cv.addEventListener("dblclick", () => resetView());
    window.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tg = e.target;
      if (tg && (tg.tagName === "INPUT" && tg.type !== "range")) return;
      const k = e.key;
      if (k === " ") { e.preventDefault(); playPause(); }
      else if (k === "ArrowRight") { e.preventDefault(); select(di + 1); }
      else if (k === "ArrowLeft") { e.preventDefault(); select(di - 1); }
      else if (k === "z" || k === "Z") undo();
      else if (k === "r" || k === "R") reset();
      else if (k === "a" || k === "A") tour();
      else if (k === "f" || k === "F") toggleFull();
      else if (k === "l" || k === "L") { show.lattice = !show.lattice; renderControls(); kick(); }
      else if (k === "c" || k === "C") { show.centers = !show.centers; renderControls(); kick(); }
      else if (k === "m" || k === "M") { show.mirrors = !show.mirrors; renderControls(); kick(); }
      else if (k === "g" || k === "G") { show.glides = !show.glides; renderControls(); kick(); }
      else if (k === "t" || k === "T") { trace = trace === "cutout" ? "outline" : trace === "outline" ? "off" : "cutout"; store.set("wpt.trace2", trace); renderControls(); kick(); }
      else if (k === "+" || k === "=") zoomBy(1.25);
      else if (k === "-" || k === "_") zoomBy(1 / 1.25);
      else if (k === "Escape") { stopTour(); queue.length = 0; if (cur && cur.playing) { cur.playing = false; renderAll(); } }
      else if (/^[1-9]$/.test(k)) { const el = D.EL[+k - 1]; if (el) request(el); }
    });
    window.addEventListener("hashchange", () => { const i = DATA.findIndex((d) => "#" + d.id === location.hash); if (i >= 0 && i !== di) select(i, true); });
    new ResizeObserver(() => resize()).observe(cv);
    const mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    if (mq && mq.addEventListener) mq.addEventListener("change", (e) => { reduced = e.matches; });
    const dq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if (dq && dq.addEventListener) dq.addEventListener("change", () => { THEME = theme(); renderCatalog(); renderDrawing(); kick(); });
    $("keys").innerHTML = ["<kbd>←</kbd> <kbd>→</kbd> drawings", "<kbd>1</kbd>–<kbd>9</kbd> moves", "<kbd>Space</kbd> play/pause", "<kbd>Z</kbd> undo", "<kbd>R</kbd> reset", "<kbd>A</kbd> play all", "<kbd>L</kbd> <kbd>C</kbd> <kbd>M</kbd> <kbd>G</kbd> show", "<kbd>T</kbd> tracing", "<kbd>F</kbd> full screen"].map((s) => `<span>${s}</span>`).join("");
  }

  function start() {
    const sp = store.get("wpt.speed"); if (sp && SPEEDS[sp]) speed = sp;
    const tr = store.get("wpt.trace2"); if (tr === "cutout" || tr === "outline" || tr === "off") trace = tr;
    try { Object.assign(show, JSON.parse(store.get("wpt.show") || "{}")); } catch (err) { /* ignore */ }
    wire();
    const fromHash = DATA.findIndex((d) => "#" + d.id === location.hash);
    const saved = DATA.findIndex((d) => d.id === store.get("wpt.tiling"));
    THEME = theme();
    select(fromHash >= 0 ? fromHash : saved >= 0 ? saved : 0, true);
    resize();
  }

  window.__wp = {
    DATA, WP,
    select(i) { select(i); },
    request(i) { request(D.EL[i]); },
    undo, reset, tour, playPause,
    setTimeScale(k) { timeScale = k; },
    tick(ms) { if (raf) { cancelAnimationFrame(raf); raf = 0; } frame(lastTs + ms); },
    project(p) { return toS(p); },
    tracingAff, screenAff,
    drawing() { return D; },
    forTiles(A, f) { forTiles(A, f); },
    setShow(k, v) { show[k] = v; renderControls(); kick(); },
    setTrace(t) { trace = t; renderControls(); kick(); },
    state() {
      const st = posState();
      return { di, id: D.id, settled: !(cur && cur.playing) && !queue.length && !touring, inTransit: !st, g: st ? st.g : null, hist: st ? st.h.slice() : null,
        cur: cur && { idx: cur.el.idx, t: cur.t, p: progress(cur), dir: cur.dir, ghost: !!cur.el.ghost, kind: cur.kind }, touring, tourInfo: tourInfo && Object.assign({}, tourInfo), view: Object.assign({}, view), scale, reduced };
    },
  };
  start();
})();
</script>
